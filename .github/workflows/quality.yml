name: Code quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build database client
        run: pnpm --filter @mgl/database build
      - name: Test database release safeguards
        run: pnpm --filter @mgl/database test:release
      - name: Build shared types
        run: pnpm --filter @mgl/types build
      - name: Type-check workspaces
        run: pnpm type-check
      - name: Run unit tests
        run: pnpm test
      - name: Report architecture debt
        run: pnpm audit:architecture
