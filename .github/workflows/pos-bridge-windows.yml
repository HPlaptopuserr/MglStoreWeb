name: PAX A35 Windows bridge prerelease

on:
  push:
    branches: [codex/pax-upgrade-20261124]
    paths:
      - packages/pos-bridge/**
      - .github/workflows/pos-bridge-windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pax-a35-bridge-20261124-upgrade
  cancel-in-progress: false

env:
  RELEASE_TAG: pax-a35-bridge-20261124-upgrade

jobs:
  package:
    if: github.ref == 'refs/heads/codex/pax-upgrade-20261124'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install bridge dependencies
        run: pnpm install --frozen-lockfile --filter @mgl/pos-bridge...
      - name: Type-check bridge
        run: pnpm --filter @mgl/pos-bridge type-check
      - name: Test protocol pairing and durable retries
        run: pnpm --filter @mgl/pos-bridge test
      - name: Build Windows native distribution and installer
        run: pnpm --filter @mgl/pos-bridge package:windows
      - name: Exercise Windows CMD upgrade with a saved terminal cancellation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Zip = "C:\tmp\mgl-pos-bridge-release\mgl-pos-bridge-android-pgw.zip"
          $Source = Join-Path $env:RUNNER_TEMP "PGW upgrade source"
          Expand-Archive -LiteralPath $Zip -DestinationPath $Source
          # Isolate machine integration, while exercising the actual CMD copy,
          # preflight, nested installed invocation and bundled pairing CLI.
          foreach ($Name in @("stop-installed-bridge.ps1", "create-pairing-shortcut.ps1", "register-startup-task.ps1")) {
            Set-Content -LiteralPath (Join-Path $Source $Name) -Value "exit 0" -Encoding ascii
          }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "PGW app data"
          $InstallDir = Join-Path $env:LOCALAPPDATA "MGLStore\pos-bridge"
          $State = Join-Path $env:LOCALAPPDATA "MGLStore\pos-bridge-data"
          New-Item -ItemType Directory -Path $InstallDir, $State | Out-Null
          "BRIDGE_PROVIDER=android-pgw" | Set-Content -LiteralPath (Join-Path $InstallDir "bridge.env") -Encoding ascii
          $Utf8 = [System.Text.UTF8Encoding]::new($false)
          $Credentials = @{ bindingId = "ci-binding"; registerId = "ci-register"; deviceId = ("c" * 32); secret = ("e" * 64); apiUrl = "http://127.0.0.1:9/api" }
          $CredentialsPath = Join-Path $State "bridge-credentials.json"
          [System.IO.File]::WriteAllText($CredentialsPath, ($Credentials | ConvertTo-Json -Compress), $Utf8)
          $Lock = Join-Path $State "terminal.lock"
          [System.IO.File]::WriteAllText($Lock, "charge:cancelled", $Utf8)
          $Hash = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($Utf8.GetBytes("charge:cancelled"))).ToLowerInvariant()
          $Saved = Join-Path $State "$Hash.json"
          $Parsed = @{code = -22; desc = "Terminal payment cancelled"; terminal = "70012386"; rrn = ""}
          $Entry = @{
            fingerprint = '{"attemptId":"cancelled","amount":4368,"terminalId":"terminal-1"}'
            terminalId = "terminal-1"
            result = @{ status = "FAILED"; provider = "ANDROID_PGW"; code = "-22"; terminal = "70012386"; raw = ($Parsed | ConvertTo-Json -Compress); parsed = $Parsed }
          }
          [System.IO.File]::WriteAllText($Saved, ($Entry | ConvertTo-Json -Depth 5 -Compress), $Utf8)
          $Before = (Get-FileHash -LiteralPath $Saved).Hash
          & (Join-Path $Source "install-android-pgw.cmd") --no-start --no-pause
          if ($LASTEXITCODE -ne 0) { throw "Windows upgrade rejected a verified terminal cancellation" }
          if (-not (Test-Path -LiteralPath (Join-Path $InstallDir "dist\index.js"))) { throw "Windows upgrade did not copy the bridge" }
          if ((Get-FileHash -LiteralPath $Saved).Hash -ne $Before -or [System.IO.File]::ReadAllText($Lock) -ne "charge:cancelled") {
            throw "Installer preflight modified the journal before bridge startup"
          }
          Push-Location $InstallDir
          try {
            & (Join-Path $InstallDir "runtime\node.exe") -e "require('./dist/android-pgw-journal').createAndroidPgwJournal(process.argv[1]).recoverStoredOperation()" $State
            if ($LASTEXITCODE -ne 0) { throw "The installed bridge could not recover the saved cancellation" }
          } finally {
            Pop-Location
          }
          if ((Test-Path -LiteralPath $Lock) -or (Get-Content -Raw -LiteralPath $Saved | ConvertFrom-Json).result.status -ne "DECLINED") {
            throw "Recovery failed to persist the cancellation and release the local reservation"
          }
      - name: Validate distribution and smoke-test bundled runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutputRoot = "C:\tmp\mgl-pos-bridge-release"
          $Zip = Join-Path $OutputRoot "mgl-pos-bridge-android-pgw.zip"
          $Exe = Join-Path $OutputRoot "MGL-POS-Bridge-android-pgw-Installer.exe"
          foreach ($File in @($Zip, $Exe)) {
            if (-not (Test-Path -LiteralPath $File -PathType Leaf) -or (Get-Item -LiteralPath $File).Length -lt 1024) {
              throw "Required Windows release asset was not generated: $File"
            }
          }
          $Header = [System.IO.File]::ReadAllBytes($Exe)
          if ($Header[0] -ne 0x4d -or $Header[1] -ne 0x5a) { throw "Installer is not a Windows executable" }

          $SmokeDir = Join-Path $env:RUNNER_TEMP "pgw-distribution-smoke"
          Expand-Archive -LiteralPath $Zip -DestinationPath $SmokeDir -Force
          foreach ($RelativePath in @("runtime\node.exe", "dist\index.js", "dist\pair.js", "pair-bridge.cmd", "create-pairing-shortcut.ps1", "install-android-pgw.cmd")) {
            if (-not (Test-Path -LiteralPath (Join-Path $SmokeDir $RelativePath) -PathType Leaf)) {
              throw "Incomplete distribution: $RelativePath"
            }
          }
          # Exercise the same Windows PowerShell COM shortcut path as the installer.
          # ASCII helper content avoids locale-dependent source decoding, while a
          # Unicode redirected Desktop path still has to work correctly.
          $ShortcutHelper = Join-Path $SmokeDir "create-pairing-shortcut.ps1"
          if (@([System.IO.File]::ReadAllBytes($ShortcutHelper) | Where-Object { $_ -gt 127 }).Count -ne 0) {
            throw "Shortcut helper must contain only portable ASCII bytes"
          }
          $UnicodeSuffix = -join ([char[]]@(0x0445, 0x043e, 0x043b, 0x0431, 0x043e, 0x0445))
          $DesktopCases = @(
            (Join-Path $env:RUNNER_TEMP "pgw-desktop-ascii"),
            (Join-Path $env:RUNNER_TEMP ("pgw-desktop-" + $UnicodeSuffix))
          )
          $ShortcutShell = New-Object -ComObject WScript.Shell
          foreach ($DesktopCase in $DesktopCases) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $ShortcutHelper -BridgeDir $SmokeDir -DesktopDir $DesktopCase
            if ($LASTEXITCODE -ne 0) { throw "Shortcut helper failed for test Desktop: $DesktopCase" }
            $LinkPath = Join-Path $DesktopCase "PAX A35 Connect.lnk"
            if (-not (Test-Path -LiteralPath $LinkPath -PathType Leaf)) { throw "Shortcut was not saved: $LinkPath" }
            # Read the actual saved link through an ASCII inspection filename:
            # the same WScript ANSI filename limitation applies when opening it.
            $InspectionLink = Join-Path $env:RUNNER_TEMP ("pgw-shortcut-inspect-" + [guid]::NewGuid().ToString("N") + ".lnk")
            [System.IO.File]::Copy($LinkPath, $InspectionLink, $true)
            $Link = $ShortcutShell.CreateShortcut($InspectionLink)
            if (-not $Link.TargetPath.Equals((Join-Path $SmokeDir "pair-bridge.cmd"), [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Pairing shortcut targets the wrong command"
            }
            if (-not $Link.WorkingDirectory.Equals($SmokeDir, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Pairing shortcut has the wrong working directory"
            }
          }
          Write-Host "Actual Windows COM shortcut creation passed for ASCII and non-ASCII Desktop paths."
          $Listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $Listener.Start()
          $Port = $Listener.LocalEndpoint.Port
          $Listener.Stop()
          $env:BRIDGE_PORT = [string]$Port
          $env:BRIDGE_PROVIDER = "mock"
          $env:BRIDGE_SHARED_SECRET = ""
          $env:BRIDGE_STARTUP_HEALTH_CHECK = "false"
          $env:BRIDGE_DATA_DIR = Join-Path $env:RUNNER_TEMP ("pgw-mock-journal-" + [guid]::NewGuid().ToString("N"))
          $Stdout = Join-Path $env:RUNNER_TEMP "pgw-smoke.stdout.log"
          $Stderr = Join-Path $env:RUNNER_TEMP "pgw-smoke.stderr.log"
          $BridgeProcess = $null
          try {
            $BridgeProcess = Start-Process -FilePath (Join-Path $SmokeDir "runtime\node.exe") -ArgumentList @("dist\index.js") -WorkingDirectory $SmokeDir -RedirectStandardOutput $Stdout -RedirectStandardError $Stderr -PassThru
            $Deadline = (Get-Date).AddSeconds(30)
            $Ready = $false
            while ((Get-Date) -lt $Deadline) {
              if ($BridgeProcess.HasExited) { throw "Packaged bridge stopped before health became ready" }
              try {
                $Health = Invoke-RestMethod -Uri "http://127.0.0.1:$Port/health" -TimeoutSec 2
                if ($Health.ok -and $Health.provider -eq "mock" -and $Health.port -eq $Port) {
                  $Ready = $true
                  break
                }
              } catch { }
              Start-Sleep -Milliseconds 250
            }
            if (-not $Ready) { throw "Packaged bridge failed mock health smoke test" }
            Write-Host "Bundled Windows Node and serialport dependency loaded; mock health passed. No serial scan or bank transaction was performed."

            # A mock launched outside the installed directory must not make the
            # paired startup wrapper report success or kill that other listener.
            $InstalledDir = Join-Path $env:RUNNER_TEMP "pgw-paired-startup-test"
            New-Item -ItemType Directory -Path $InstalledDir -Force | Out-Null
            @("@echo off", "echo unexpected-start>started-unexpectedly.txt", "exit /b 42") | Set-Content -LiteralPath (Join-Path $InstalledDir "start-windows.cmd") -Encoding ascii
            "BRIDGE_PORT=$Port" | Set-Content -LiteralPath (Join-Path $InstalledDir "bridge.env") -Encoding ascii
            $PairedState = Join-Path $env:RUNNER_TEMP "pgw-paired-test-state"
            New-Item -ItemType Directory -Path $PairedState -Force | Out-Null
            @{ bindingId = "ci-binding"; registerId = "ci-register"; deviceId = ("c" * 32); secret = ("e" * 64); apiUrl = "http://127.0.0.1:9/api" } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $PairedState "bridge-credentials.json") -Encoding ascii
            $env:BRIDGE_DATA_DIR = $PairedState
            $StartupProbeScript = Join-Path $SmokeDir "start-windows-task.ps1"
            $StartupProbe = Start-Process -FilePath "powershell.exe" -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$StartupProbeScript`"", "-BridgeDir", "`"$InstalledDir`"") -NoNewWindow -Wait -PassThru
            if ($StartupProbe.ExitCode -eq 0) { throw "Paired startup falsely succeeded while an unrelated mock retained the port" }
            if (Test-Path -LiteralPath (Join-Path $InstalledDir "started-unexpectedly.txt")) { throw "Startup launched a second bridge on an occupied port" }
            if ($BridgeProcess.HasExited) { throw "Startup killed an existing listener instead of diagnosing it" }
            $ReadinessProbeScript = Join-Path $SmokeDir "check-bridge-ready.ps1"
            $ReadinessProbe = Start-Process -FilePath "powershell.exe" -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "`"$ReadinessProbeScript`"", "-BridgeDir", "`"$InstalledDir`"", "-TimeoutSeconds", "2") -NoNewWindow -Wait -PassThru
            if ($ReadinessProbe.ExitCode -eq 0) { throw "Readiness falsely accepted the unrelated mock listener" }
            $StillMock = Invoke-RestMethod -Uri "http://127.0.0.1:$Port/health" -TimeoutSec 2
            if ($StillMock.provider -ne "mock") { throw "Occupied-port test changed the running provider" }
            Write-Host "Paired startup correctly rejected an unrelated mock listener without stopping it."
            # Expected failures are inspected as process ExitCode values; they
            # never poison the runner's script-local native LASTEXITCODE.
            $LASTEXITCODE = 0
          } catch {
            if (Test-Path -LiteralPath $Stderr) { Get-Content -LiteralPath $Stderr }
            throw
          } finally {
            if ($BridgeProcess -and -not $BridgeProcess.HasExited) {
              Stop-Process -Id $BridgeProcess.Id -Force
              Wait-Process -Id $BridgeProcess.Id -Timeout 10 -ErrorAction SilentlyContinue
            }
          }

          $Checksums = foreach ($File in @($Zip, $Exe)) {
            $Hash = (Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $([System.IO.Path]::GetFileName($File))"
          }
          $Checksums | Set-Content -LiteralPath (Join-Path $OutputRoot "SHA256SUMS.txt") -Encoding ascii
          @"
          Windows bridge prerelease for Admin PAX A35 one-time pairing.

          Source commit: $env:GITHUB_SHA
          Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          Built and unit-tested on Windows with Node 22. Actual Windows PowerShell COM shortcut creation was verified for ASCII and non-ASCII Desktop directories. The extracted distribution's bundled runtime passed mock health; no physical terminal was scanned or charged. Actual bank USB driver and PAX hardware acceptance remain required. This release does not claim Windows 7 support.

          Finish pending transactions before upgrading. Preserve the local payment journal. The installer creates the Desktop shortcut PAX A35 Connect and prompts for the Admin pairing link unless a valid pairing already exists. The cloud deployment does not update cashier PCs automatically.
          "@ | Set-Content -LiteralPath (Join-Path $OutputRoot "RELEASE-NOTES.md") -Encoding utf8
      - name: Retain verified Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: pax-a35-windows-assets
          if-no-files-found: error
          retention-days: 14
          path: |
            C:\tmp\mgl-pos-bridge-release\mgl-pos-bridge-android-pgw.zip
            C:\tmp\mgl-pos-bridge-release\MGL-POS-Bridge-android-pgw-Installer.exe
            C:\tmp\mgl-pos-bridge-release\SHA256SUMS.txt
            C:\tmp\mgl-pos-bridge-release\RELEASE-NOTES.md

  publish:
    if: github.ref == 'refs/heads/codex/pax-upgrade-20261124'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pax-a35-windows-assets
          path: verified-windows-assets
      - name: Publish immutable prerelease assets
        working-directory: verified-windows-assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent 2>tag-check.err; then
            echo "::error::Release tag already exists; refusing to replace installer assets."
            exit 1
          fi
          case "$(cat tag-check.err)" in
            *"HTTP 404"*) ;;
            *) cat tag-check.err; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PAX A35 bridge installer update 2026-11-24" \
            --notes-file RELEASE-NOTES.md \
            --prerelease \
            mgl-pos-bridge-android-pgw.zip \
            MGL-POS-Bridge-android-pgw-Installer.exe \
            SHA256SUMS.txt
