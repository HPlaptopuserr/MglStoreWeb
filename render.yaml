services:
  - type: web
    name: mgl-web
    rootDir: .
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @mgl/database run db:generate && pnpm run build
    startCommand: cd apps/web && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: mgl-admin
    rootDir: .
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @mgl/database run db:generate && pnpm run build
    startCommand: cd apps/admin && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: web
    name: mgl-vendor
    rootDir: .
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @mgl/database run db:generate && pnpm run build
    startCommand: cd apps/vendor && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

  - type: web
    name: mgl-api
    rootDir: .
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @mgl/database run db:generate && pnpm run build
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WEB_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: VENDOR_URL
        sync: false

databases:
  - name: mglstore
    databaseName: mglstore
    user: mglstore
    plan: standard
    version: "15"
