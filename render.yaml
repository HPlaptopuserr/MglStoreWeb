  - type: web
    name: mgl-api
    rootDir: .
    runtime: node
    buildFilter:
      paths:
        - apps/api/**
        - packages/database/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma migrate deploy --schema=packages/database/prisma/schema.prisma && pnpm -F @mgl/database run db:generate && pnpm turbo build --filter=@mgl/api
    startCommand: cd apps/api && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SYSTEMQR_ROOT_URL
        value: https://api.minu.mn
      - key: SYSTEMQR_BASE_URL
        value: https://api.minu.mn/qrpay
      - key: SYSTEMQR_DEEPLINK_URL
        value: https://api.minu.mn/deeplink
      - key: SYSTEMQR_USERNAME
        sync: false
      - key: SYSTEMQR_PASSWORD
        sync: false
      - key: PUSH_ECR_BASE_URL
        value: https://push.easypay.mn:8443
      - key: PUSH_ECR_API_KEY
        sync: false
      - key: PUSH_ECR_CLIENT_ID
        sync: false
      - key: PUSH_ECR_TERMINAL_ID
        sync: false

databases:
  - name: mglstore
    databaseName: mglstore
    user: mglstore
    plan: standard
    version: "15"
