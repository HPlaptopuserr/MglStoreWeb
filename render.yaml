  - type: web
    name: mgl-business
    rootDir: .
    runtime: node
    buildFilter:
      paths:
        - apps/business/**
        - packages/ui/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
