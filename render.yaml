services:
  - type: web
    name: mgl-web
    rootDir: .
    runtime: node
    buildFilter:
      paths:
        - apps/web/**
        - packages/ui/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @mgl/database run db:generate && pnpm turbo build --filter=@mgl/web
    startCommand: cd apps/web && pnpm exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: web
    name: mgl-admin
    rootDir: .
    runtime: node
    buildFilter:
      paths:
        - apps/admin/**
        - packages/ui/**
        - packages/types/**
        - packages/config/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - render.yaml
    buildCommand: pnpm install --frozen-lockfile && pnpm -F @mgl/database run db:generate && pnpm turbo build --filter=@mgl/admin
    startCommand: HOST=0.0.0.0 PORT=$PORT node apps/admin/.next/standalone/apps/admin/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

